name: Reusable SDD Security Review

on:
  workflow_call:
    inputs:
      notion-sdd-url:
        description: 'Notion SDD page URL (required)'
        required: true
        type: string
      source-repos:
        description: 'Source code repos (comma-separated, e.g. <organization>/repo1,<organization>/repo2)'
        required: false
        type: string
        default: ''
      source-file-patterns:
        description: 'File path patterns to fetch from repos (comma-separated, e.g. src/auth/,models.py,config/)'
        required: false
        type: string
        default: ''
      spec-markdown-path:
        description: 'Path to specification markdown file(s) in the caller repo'
        required: false
        type: string
        default: ''
      architecture-diagram-path:
        description: 'Path to architecture diagram file (PNG, SVG, draw.io) in the caller repo'
        required: false
        type: string
        default: ''
      security-concerns-path:
        description: 'Path to markdown file with security concerns in the caller repo'
        required: false
        type: string
        default: ''
      platform-context-path:
        description: 'Path to platform context markdown (describes your architecture patterns, multi-tenancy, IAM model)'
        required: false
        type: string
        default: ''
      team-questions-path:
        description: 'Path to markdown file with specific questions the team wants addressed'
        required: false
        type: string
        default: ''
      skip-notifications:
        description: 'Set to true to suppress Slack and Linear notifications for this run (e.g. for testing or re-runs)'
        required: false
        type: boolean
        default: false
      security-ref:
        description: >
          Git ref (commit SHA, tag or branch) of <organization>/security to check
          the scripts out at. Pass the same SHA you pin in `uses: ...@<sha>`: pinning
          `uses:` alone pins this workflow file, not the scripts it runs.
          Defaults to main, which is what every caller got before this input existed.
        required: false
        type: string
        default: 'main'
    secrets:
      ANTHROPIC_API_KEY:
        description: 'Anthropic API key for Claude'
        required: true
      NOTION_TOKEN:
        description: 'Notion integration token'
        required: true
      # Org-level GitHub App credentials — mint a token that can read the
      # private security repo for the script checkout. Pass them, or
      # `secrets: inherit`, from every caller.
      SECURITY_GITHUB_APP_ID:
        description: 'GitHub App id — used to mint a token that can read the security repo'
        required: false
      SECURITY_GITHUB_APP_PRIVATE_KEY:
        description: 'GitHub App private key — paired with SECURITY_GITHUB_APP_ID'
        required: false
      SOURCE_REPO_TOKEN:
        description: 'GitHub token with access to source repos (falls back to github.token). NOT used for the security repo checkout — that is the App token.'
        required: false
      SDD_SLACK_WEBHOOK_URL:
        description: 'Slack incoming webhook URL for #security-helpdesk — notifications fire automatically when set'
        required: false
      LINEAR_API_KEY:
        description: 'Linear API key for the Security team — triage tickets fire automatically when set and involvement is Required'
        required: false
    outputs:
      review-status:
        description: 'Status of the SDD review (success or failure)'
        value: ${{ jobs.sdd-review.outputs.status }}

jobs:
  sdd-review:
    runs-on: ubuntu-latest
    # `secrets` can't be referenced in a step `if:` — only in with/env/run. Surface
    # the App secret's presence here so the mint/warn steps can gate on it.
    env:
      HAS_SECURITY_APP_TOKEN: ${{ secrets.SECURITY_GITHUB_APP_ID != '' && secrets.SECURITY_GITHUB_APP_PRIVATE_KEY != '' }}
    outputs:
      status: ${{ steps.review-status.outputs.result }}
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
    - name: Checkout caller repo
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # See pr-review-reusable.yml for the full rationale: a caller's github.token
    # can't read a different private repo, so mint a scoped App token for the
    # script checkout. Skipped when the App secrets aren't passed; the checkout
    # then falls back and logs why it will 404.
    - name: Mint security repo read token
      id: security-token
      if: ${{ env.HAS_SECURITY_APP_TOKEN == 'true' }}
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ secrets.SECURITY_GITHUB_APP_ID }}
        private-key: ${{ secrets.SECURITY_GITHUB_APP_PRIVATE_KEY }}
        owner: <organization>
        repositories: security
        permission-contents: read

    - name: Warn if security repo token unavailable
      if: ${{ steps.security-token.outcome == 'skipped' && github.repository != '<organization>/security' }}
      run: |
        echo "::warning title=No security App token::SECURITY_GITHUB_APP_ID / SECURITY_GITHUB_APP_PRIVATE_KEY were not passed to this reusable, so the security script checkout will use github.token and 404 on a private repo. Pass the org secrets — 'secrets: inherit' is easiest."

    - name: Checkout security scripts
      uses: actions/checkout@v7
      with:
        repository: <organization>/security
        ref: ${{ inputs.security-ref }}
        token: ${{ steps.security-token.outputs.token || (secrets.SOURCE_REPO_TOKEN != '' && secrets.SOURCE_REPO_TOKEN) || github.token }}
        path: .security
        sparse-checkout: |
          .github/scripts/sdd_reviewer.py
          .github/scripts/sdd_notify.py
          shared/ai_config.py
        sparse-checkout-cone-mode: false

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install anthropic==1.4.0 requests notion-client PyYAML

    - name: Run SDD Security Review
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Optional AI proxy base URL (repo var); empty = direct to Anthropic.
        ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN != '' && secrets.SOURCE_REPO_TOKEN || github.token }}
        NOTION_SDD_URL: ${{ inputs.notion-sdd-url }}
        SOURCE_REPOS: ${{ inputs.source-repos }}
        SOURCE_FILE_PATTERNS: ${{ inputs.source-file-patterns }}
        SPEC_MARKDOWN_PATH: ${{ inputs.spec-markdown-path }}
        ARCHITECTURE_DIAGRAM_PATH: ${{ inputs.architecture-diagram-path }}
        SECURITY_CONCERNS_PATH: ${{ inputs.security-concerns-path }}
        PLATFORM_CONTEXT_PATH: ${{ inputs.platform-context-path }}
        TEAM_QUESTIONS_PATH: ${{ inputs.team-questions-path }}
        RISK_REGISTER_REPO: <organization>/risk-register
        REPO_FULL_NAME: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        python .security/.github/scripts/sdd_reviewer.py

    - name: Notify Security
      if: success() && inputs.skip-notifications != true
      env:
        REVIEW_OUTPUT_FILE: sdd_review_output.json
        REVIEW_URL: ${{ inputs.notion-sdd-url }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        SLACK_WEBHOOK_URL: ${{ secrets.SDD_SLACK_WEBHOOK_URL }}
        LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        # Optional link to your Security triage queue, shown in the Slack post.
        LINEAR_TRIAGE_URL: ${{ vars.LINEAR_TRIAGE_URL }}
      run: |
        python3 .security/.github/scripts/sdd_notify.py

    - name: Set review status
      id: review-status
      if: always()
      run: |
        if [ -f sdd_review_output.json ]; then
          echo "result=success" >> $GITHUB_OUTPUT
        else
          echo "result=failure" >> $GITHUB_OUTPUT
        fi

    - name: Upload review results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: sdd-review-results
        path: |
          sdd_review_output.json
          sdd_review_questions.md
          sdd_review_architecture.drawio
        retention-days: 90
